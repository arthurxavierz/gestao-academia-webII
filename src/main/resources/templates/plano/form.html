<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${plano.id != null ? 'Editar Plano' : 'Cadastrar Plano'})}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/menu :: menu('planos')}"></aside>

    <main class="conteudo">
        <header th:replace="~{fragments/menu :: topo('Planos')}"></header>

        <div class="pagina">
            <div class="pagina-cabecalho">
                <div>
                    <h2 th:text="${plano.id != null ? 'Editar plano' : 'Cadastrar plano'}">Cadastrar plano</h2>
                    <p>Preencha os dados do plano.</p>
                </div>
            </div>

            <div class="card-form">
                <form th:action="${plano.id != null ? '/planos/atualizar/' + plano.id : '/planos/salvar'}"
                      th:object="${plano}" method="post">
                    <input type="hidden" th:if="${plano.id != null}" th:field="*{id}">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" th:field="*{nome}" class="form-control" th:errorclass="is-invalid"
                                   placeholder="Ex.: Mensal, Trimestral">
                            <div class="invalid-feedback" th:errors="*{nome}"></div>
                        </div>
                        <div class="col-md-3">
                            <label for="valor" class="form-label">Valor (R$)</label>
                            <input type="number" step="0.01" th:field="*{valor}" class="form-control"
                                   th:errorclass="is-invalid" placeholder="0,00">
                            <div class="invalid-feedback" th:errors="*{valor}"></div>
                        </div>
                        <div class="col-md-3">
                            <label for="duracaoDias" class="form-label">Duração (dias)</label>
                            <input type="number" th:field="*{duracaoDias}" class="form-control"
                                   th:errorclass="is-invalid" placeholder="30">
                            <div class="invalid-feedback" th:errors="*{duracaoDias}"></div>
                        </div>
                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{ativo}">
                                <label class="form-check-label" for="ativo1">Plano ativo</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-botoes">
                        <button type="submit" class="btn btn-principal"
                                th:text="${plano.id != null ? 'Atualizar Plano' : 'Cadastrar Plano'}">Salvar</button>
                        <a th:href="@{/planos}" class="btn btn-light">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </main>
</div>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
