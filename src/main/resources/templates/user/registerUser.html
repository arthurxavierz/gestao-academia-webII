<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Cadastrar usuário')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/menu :: menu('usuarios')}"></aside>

    <main class="conteudo">
        <header th:replace="~{fragments/menu :: topo('Usuários')}"></header>

        <div class="pagina">
            <div class="pagina-cabecalho">
                <div>
                    <h2>Cadastrar usuário</h2>
                    <p>Crie o acesso de quem vai usar o sistema e escolha o perfil.</p>
                </div>
            </div>

            <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

            <div class="card-form">
                <form th:action="@{/saveUser}" th:object="${user}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Nome</label>
                            <input type="text" class="form-control" th:field="*{name}" th:errorclass="is-invalid"
                                   placeholder="Digite o nome">
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid"
                                   placeholder="Digite o e-mail">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="password" class="form-label">Senha</label>
                            <input type="password" class="form-control" th:field="*{password}" th:errorclass="is-invalid"
                                   placeholder="Digite a senha">
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                        </div>
                        <div class="col-12">
                            <label class="form-label d-block">Perfil</label>
                            <div class="opcoes">
                                <label class="opcao">
                                    <input type="checkbox" th:field="*{roles}" value="Admin"> Admin
                                </label>
                                <label class="opcao">
                                    <input type="checkbox" th:field="*{roles}" value="Recepcao"> Recepção
                                </label>
                                <label class="opcao">
                                    <input type="checkbox" th:field="*{roles}" value="Aluno"> Aluno
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="form-botoes">
                        <button type="submit" class="btn btn-principal">Cadastrar Usuário</button>
                        <a th:href="@{/}" class="btn btn-light">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </main>
</div>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
