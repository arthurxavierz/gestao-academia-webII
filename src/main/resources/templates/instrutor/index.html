<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Instrutores')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/menu :: menu('instrutores')}"></aside>

    <main class="conteudo">
        <header th:replace="~{fragments/menu :: topo('Instrutores')}"></header>

        <div class="pagina">
            <div class="pagina-cabecalho">
                <div>
                    <h2>Instrutores cadastrados</h2>
                    <p>Profissionais da academia e as modalidades que cada um dá aula.</p>
                </div>
                <a sec:authorize="hasAuthority('Admin')" th:href="@{/instrutores/novo}" class="btn btn-principal">
                    <i class="bi bi-plus-lg"></i> Cadastrar Instrutor
                </a>
            </div>

            <div th:if="${param.erroExclusao}" class="alert alert-warning">
                Este instrutor está em uso e não pode ser excluído.
            </div>

            <div class="card-tabela">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>CREF</th>
                            <th>Especialidade</th>
                            <th>Modalidades</th>
                            <th sec:authorize="hasAuthority('Admin')" class="text-end">Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="instrutor : ${instrutores}">
                            <td th:text="${instrutor.id}"></td>
                            <td class="fw-semibold" th:text="${instrutor.nome}"></td>
                            <td class="text-nowrap" th:text="${instrutor.cref}"></td>
                            <td class="text-secondary" th:text="${instrutor.especialidade}"></td>
                            <td>
                                <span th:each="m : ${instrutor.modalidades}" class="etiqueta" th:text="${m.nome}"></span>
                                <span th:if="${#lists.isEmpty(instrutor.modalidades)}" class="text-secondary">-</span>
                            </td>
                            <td sec:authorize="hasAuthority('Admin')" class="text-end text-nowrap">
                                <a th:href="@{/instrutores/editar/{id}(id=${instrutor.id})}" class="btn-acao" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/instrutores/excluir/{id}(id=${instrutor.id})}" class="btn-acao perigo"
                                   title="Excluir" onclick="return confirm('Deseja realmente excluir este instrutor?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(instrutores)}">
                            <td colspan="6" class="vazio">Nenhum instrutor cadastrado.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </main>
</div>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
