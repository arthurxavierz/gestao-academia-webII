<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${instrutor.id != null ? 'Editar Instrutor' : 'Cadastrar Instrutor'})}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/menu :: menu('instrutores')}"></aside>

    <main class="conteudo">
        <header th:replace="~{fragments/menu :: topo('Instrutores')}"></header>

        <div class="pagina">
            <div class="pagina-cabecalho">
                <div>
                    <h2 th:text="${instrutor.id != null ? 'Editar instrutor' : 'Cadastrar instrutor'}">Cadastrar instrutor</h2>
                    <p>Preencha os dados do instrutor e marque as modalidades que ele dá aula.</p>
                </div>
            </div>

            <div class="card-form">
                <form th:action="${instrutor.id != null ? '/instrutores/atualizar/' + instrutor.id : '/instrutores/salvar'}"
                      th:object="${instrutor}" method="post">
                    <input type="hidden" th:if="${instrutor.id != null}" th:field="*{id}">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" th:field="*{nome}" class="form-control" th:errorclass="is-invalid"
                                   placeholder="Nome completo">
                            <div class="invalid-feedback" th:errors="*{nome}"></div>
                        </div>
                        <div class="col-md-3">
                            <label for="cref" class="form-label">CREF</label>
                            <input type="text" th:field="*{cref}" class="form-control" th:errorclass="is-invalid"
                                   placeholder="000000-G/MG">
                            <div class="invalid-feedback" th:errors="*{cref}"></div>
                        </div>
                        <div class="col-md-3">
                            <label for="especialidade" class="form-label">Especialidade</label>
                            <input type="text" th:field="*{especialidade}" class="form-control" th:errorclass="is-invalid"
                                   placeholder="Ex.: Hipertrofia">
                            <div class="invalid-feedback" th:errors="*{especialidade}"></div>
                        </div>
                        <div class="col-12">
                            <label class="form-label d-block">Modalidades</label>
                            <div class="opcoes">
                                <label class="opcao" th:each="m : ${modalidades}">
                                    <input type="checkbox" name="modalidadeIds" th:value="${m.id}"
                                           th:checked="${#lists.contains(instrutor.modalidades, m)}">
                                    <span th:text="${m.nome}">Musculação</span>
                                </label>
                                <span th:if="${#lists.isEmpty(modalidades)}" class="text-secondary">
                                    Nenhuma modalidade cadastrada ainda.
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="form-botoes">
                        <button type="submit" class="btn btn-principal"
                                th:text="${instrutor.id != null ? 'Atualizar Instrutor' : 'Cadastrar Instrutor'}">Salvar</button>
                        <a th:href="@{/instrutores}" class="btn btn-light">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </main>
</div>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
